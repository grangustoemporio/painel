  --bg0:#001F1D;--bg1:#00302D;--bg2:#004541;--bg3:#0A5A54;
  --cream:#FFF2E3;--muted:#B4C6C0;--line:rgba(255,242,227,.16);--line2:rgba(255,242,227,.34);
  --glass:rgba(255,242,227,.05);--red:#C6243B;--err:#FFA69A;--okc:#9FE0C9;--warnc:#F2C879;
  --ok:#9FE0C9;--bad:#FFA69A;--warn:#F2C879;
  --display:"Italiana","Times New Roman",serif;
  --sans:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --r:16px;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg0);color:var(--cream);font:400 16px/1.45 var(--sans);min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(56rem 32rem at 82% -10%,rgba(16,128,118,.38),transparent 62%),radial-gradient(44rem 30rem at -8% 108%,rgba(0,69,65,.85),transparent 62%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;background:linear-gradient(rgba(255,242,227,.04) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(255,242,227,.04) 1px,transparent 1px) 0 0/56px 56px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.12;letter-spacing:.02em}
h2{font-size:24px}
h3{font-size:21px}
small,.muted{color:var(--muted)}
small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.logo{display:block;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.logo.stack{-webkit-mask-image:var(--m-stack);mask-image:var(--m-stack);aspect-ratio:405/389}
.logo.horiz{-webkit-mask-image:var(--m-horiz);mask-image:var(--m-horiz);aspect-ratio:639/175}
.eyebrow{font:700 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(0,31,29,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(16px,calc((100% - 900px)/2 + 16px));padding-top:calc(8px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{height:34px;color:var(--cream)}
.brand .role{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line2);padding-left:12px;white-space:nowrap}
.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--cream);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.ghost:hover{background:var(--glass)}
.demo{background:rgba(198,36,59,.18);color:var(--cream);font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid rgba(198,36,59,.5)}
#periodBar{position:sticky;top:calc(51px + env(safe-area-inset-top));z-index:15;background:rgba(0,31,29,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:8px 16px;border-bottom:1px solid var(--line)}
.pbar{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center}
.pbar select{flex:1;min-width:0}
.pbar .arr{width:44px;padding:0;flex:none}
a{color:var(--cream);text-decoration-color:var(--line2)}
main{max-width:900px;margin:0 auto;padding:16px 16px 110px}

/* navegação inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,31,29,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:900px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 6px 4px;gap:2px}
nav button{background:none;border:0;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative;border-radius:14px;font-weight:700}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--bg2);background:var(--cream)}
nav .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

/* cartões */
.card{background:linear-gradient(180deg,rgba(255,242,227,.08),rgba(255,242,227,.03));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card>h2,.card>h3{margin-bottom:8px}
.card.pend{border-color:rgba(242,200,121,.55);background:linear-gradient(180deg,rgba(242,200,121,.12),rgba(242,200,121,.04))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.stat .l{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.v.bad{color:var(--bad)}.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 8px}
.sec:first-child{margin-top:0}
.sec h2,.sec h3{text-transform:uppercase;letter-spacing:.08em;font-size:21px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cream);color:var(--bg2);border:2px solid var(--cream);border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;min-height:46px;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,box-shadow .2s}
.btn:hover{box-shadow:0 0 0 4px rgba(255,242,227,.14),0 0 24px rgba(255,242,227,.2)}
.btn:active{filter:brightness(.92)}
.btn.sec2{background:transparent;color:var(--cream);border-color:var(--line2)}
.btn.sec2:hover{background:var(--glass);border-color:var(--cream);box-shadow:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.link{background:none;border:0;color:var(--muted);padding:6px 4px;min-height:0;text-decoration:underline;box-shadow:none;font-weight:400}
.btn.link:hover{box-shadow:none;color:var(--cream)}
.btn.sm{padding:5px 14px;min-height:36px;font-size:14px}
.btn.wa{background:#25D366;border-color:#25D366;color:#053B1D}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}

/* formulários */

input,select,textarea{border:1.5px solid var(--line2);background:rgba(0,0,0,.22);color:var(--cream);border-radius:12px;padding:10px 13px;min-height:46px;font-size:16px;width:100%}
input::placeholder,textarea::placeholder{color:#8FA59F}

input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--cream)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chip{flex:none;border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative}
.chip:hover{background:var(--glass)}
.chip.on{background:var(--cream);color:var(--bg2);border-color:var(--cream)}
.chip .n{display:inline-block;margin-left:6px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.b{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b.ok{background:rgba(159,224,201,.14);color:var(--ok);border-color:rgba(159,224,201,.4)}
.b.warn{background:rgba(242,200,121,.14);color:var(--warn);border-color:rgba(242,200,121,.4)}
.b.bad{background:rgba(198,36,59,.22);color:var(--err);border-color:rgba(255,166,154,.45)}
.b.mut{background:var(--glass);color:var(--muted);border-color:var(--line2)}

/* listas */
.list .it{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}

.it .t{font-weight:700;overflow-wrap:anywhere}

.it.click{cursor:pointer}
.it.click:hover .t{text-decoration:underline;text-decoration-color:var(--line2)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:1px dashed var(--line2);margin-top:4px}
.bars{display:flex;align-items:stretch;gap:2px;height:120px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;min-width:0}

.prow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}

.prow label{font-size:11.5px;color:var(--muted)}

.prow.low{background:rgba(242,200,121,.1);margin:0 -16px;padding-left:16px;padding-right:16px}
.crow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.crow .pname{font-weight:700;overflow-wrap:anywhere}

.big-chip{padding:11px 20px;font-size:16px}

.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}

<body>

<script type="module">

/* ============================ helpers ============================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = n => (Number(n) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const pct = n => (n * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const byName = (a, b) => norm(a.name).localeCompare(norm(b.name));
const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function isoOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); }
function addMonths(iso, n) {
  const [y, m, dd] = iso.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1, 12);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dd, last));
  return isoOf(d);
}
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
const fmtShort = iso => iso ? iso.split('-').reverse().slice(0, 2).join('/') : '';
const weekday = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
function parseMoney(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v ?? '').trim().replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

const ICONS = {

  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',

function toast(msg, type = '') {

function downloadCSV(name, rows) {
  const q = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const csvNum = n => (Number(n) || 0).toFixed(2).replace('.', ',');

function compressImage(file, max = 1400, q = 0.62) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let scale = Math.min(1, max / Math.max(img.width, img.height)); let out = '';
      for (let i = 0; i < 6; i++) {
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 850000) break;
        scale *= 0.8;
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não consegui ler a imagem')); };
    img.src = url;
  });
}

const photoIdsOf = o => (o && o.photoIds && o.photoIds.length) ? o.photoIds : (o && o.photoId ? [o.photoId] : []);
const fmtWhen = iso => { try { const d = new Date(iso), t = todayISO(); const day = isoOf(d) === t ? 'hoje' : fmtShort(isoOf(d)); return `${day} às ${pad(d.getHours())}:${pad(d.getMinutes())}`; } catch (e) { return ''; } };

function waLink(phone, msg) {
  let d = String(phone || '').replace(/\D/g, '').replace(/^0+/, '');
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
}

const S = {

let DB = null;      // implementação ativa (demo ou firebase)
let fbm = null;     // módulos do firebase
let fbAuth = null, fbDb = null;

const DBdemo = {
  store: {}, subs: [],
  _all(c) { return Object.values(this.store[c] || {}); },
  _emit(s) { let rows = this._all(s.c); if (s.where) rows = rows.filter(r => r[s.where[0]] === s.where[2]); s.cb(structuredClone(rows)); },
  _notify(c) { this.subs.filter(s => s.c === c).forEach(s => this._emit(s)); },
  subscribe(c, cb, where) { const s = { c, cb, where }; this.subs.push(s); setTimeout(() => this._emit(s), 0); return () => { this.subs = this.subs.filter(x => x !== s); }; },
  async get(c, id) { const r = (this.store[c] || {})[id]; return r ? structuredClone(r) : null; },
  set(c, id, data, merge = true) {
    const { id: _i, ...d } = data;
    this.store[c] = this.store[c] || {};
    const cur = this.store[c][id];
    this.store[c][id] = merge && cur ? { ...cur, ...structuredClone(d), id } : { ...structuredClone(d), id };
    this._notify(c); return Promise.resolve();
  },
  del(c, id) { if (this.store[c]) delete this.store[c][id]; this._notify(c); return Promise.resolve(); },
  async batch(ops) { for (const o of ops) { if (o.t === 'del') await this.del(o.coll, o.id); else await this.set(o.coll, o.id, o.data, o.merge !== false); } }
};

function makeFbDb() {
  const fs = fbm.fs;
  return {
    subscribe(c, cb, where) {
      let q = fs.collection(fbDb, c);
      if (where) q = fs.query(q, fs.where(where[0], where[1], where[2]));
      return fs.onSnapshot(q, snap => cb(snap.docs.map(d => ({ ...d.data(), id: d.id }))), err => { console.error(c, err); toast('Sem permissão/erro ao ler ' + c, 'err'); });
    },
    async get(c, id) { const s = await fs.getDoc(fs.doc(fbDb, c, id)); return s.exists() ? { ...s.data(), id: s.id } : null; },
    set(c, id, data, merge = true) { const { id: _i, ...d } = data; return fs.setDoc(fs.doc(fbDb, c, id), d, { merge }); },
    del(c, id) { return fs.deleteDoc(fs.doc(fbDb, c, id)); },
    async batch(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = fs.writeBatch(fbDb);
        ops.slice(i, i + 400).forEach(o => {
          const ref = fs.doc(fbDb, o.coll, o.id);
          if (o.t === 'del') b.delete(ref); else { const { id: _i, ...d } = o.data; b.set(ref, d, { merge: o.merge !== false }); }
        });
        await b.commit();
      }
    }
  };
}
// dispara a escrita sem travar a tela (funciona offline: sincroniza quando a internet voltar)
function save(p) { Promise.resolve(p).catch(e => { console.error(e); toast('Erro ao salvar: ' + (e.code || e.message), 'err'); }); }

async function initFirebase() {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  fbm = { app, auth, fs };
  const a = app.initializeApp(CFG.firebase);
  fbAuth = auth.getAuth(a);
  try {
    fbDb = fs.initializeFirestore(a, { ignoreUndefinedProperties: true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  } catch (e) { fbDb = fs.getFirestore(a); }
  DB = makeFbDb();
}

  else { const n = new Date(S.period.y, S.period.m + 1, 0).getDate(); items = Array.from({ length: n }, (_, i) => { const d = `${S.period.y}-${pad(S.period.m + 1)}-${pad(i + 1)}`; const s = D.sales.find(x => x.date === d); const v = s ? saleTotal(s) : 0; return { l: n > 20 && i % 2 ? '' : i + 1, v, t: `${fmtDate(d)}: ${brl(v)}` }; }); }
  const daysWith = ps.filter(s => saleTotal(s) > 0).length;
  const alerts = [];
  if (pend.length) alerts.push(`<div class="alert warn" data-act="tab" data-tab="recv"><span><b>${pend.length} nota${pend.length > 1 ? 's' : ''} enviada${pend.length > 1 ? 's' : ''} aguardando lançamento</b><br><small>${(() => { const d = Math.max(...pend.map(r => daysBetween(r.date, t))); return d > 0 ? 'A mais antiga chegou há ' + d + ' dia(s)' : 'Chegaram hoje'; })()}. Lance quando puder.</small></span><span>&rsaquo;</span></div>`);
  const unseen = D.stockCounts.filter(c => !c.seen);
  if (unseen.length) {
    const sids = [...new Set(unseen.map(c => c.supplierId))], n = sids.reduce((a, s) => a + pendingCount(s), 0);
    const last = unseen.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0];
    alerts.push(`<div class="alert warn" data-act="openCount" data-sid="${last.supplierId}"><span><b>Contagem de estoque nova: ${esc(sids.map(supName).join(', '))}</b><br><small>${esc(last.createdByName || 'Equipe')} enviou ${fmtWhen(last.createdAt)} · ${n} item(ns) para pedir</small></span><span>&rsaquo;</span></div>`);
  }
  if (overdue.length) alerts.push(`<div class="alert bad" data-act="go" data-tab="bills" data-f="vencidos"><span><b>${overdue.length} boleto${overdue.length > 1 ? 's' : ''} vencido${overdue.length > 1 ? 's' : ''}: ${brl(sum(overdue, b => b.amount))}</b><br><small>Confira e pague ou negocie</small></span><span>&rsaquo;</span></div>`);
  if (low.length) alerts.push(`<div class="alert warn" data-act="go" data-tab="stock" data-sub="order"><span><b>${low.length} produto${low.length > 1 ? 's' : ''} no estoque mínimo ou abaixo</b><br><small>Gere o pedido para o fornecedor</small></span><span>&rsaquo;</span></div>`);
  if (up.length) alerts.push(`<div class="alert warn" data-act="go" data-tab="stock" data-sub="prices"><span><b>${up.length} produto${up.length > 1 ? 's' : ''} com custo em alta</b><br><small>Reveja o preço de venda</small></span><span>&rsaquo;</span></div>`);
  if (S.mode !== 'demo' && S.loaded.products && S.loaded.suppliers && !S.data.products.length) alerts.unshift(`<div class="alert" data-act="loadNotion"><span><b>Comece carregando seus fornecedores e produtos</b><br><small>Já preparados a partir do seu Notion. Toque para carregar.</small></span><span>&rsaquo;</span></div>`);
  return `
  ${alerts.join('')}
  <div class="sec"><h2>Hoje</h2><small>${fmtDate(t)}</small></div>
  <div class="grid">
    <div class="card stat"><div class="l">Vendas de hoje</div><div class="v">${todaySale ? brl(saleTotal(todaySale)) : '—'}</div><div class="s">${todaySale ? 'lançado' : '<a href="#" data-act="go" data-tab="sales">lançar agora</a>'}</div></div>
    <div class="card stat"><div class="l">Mercadoria que entrou hoje</div><div class="v">${brl(sum(recvToday, e => e.total))}</div><div class="s">${recvToday.length} recebimento${recvToday.length === 1 ? '' : 's'}${pend.filter(r => r.date === t).length ? ` · ${pend.filter(r => r.date === t).length} nota(s) a lançar` : ''}</div></div>
  </div>
  <div class="sec"><h2>${periodLabel()}</h2></div>
  <div class="grid">
    <div class="card stat"><div class="l">Vendas no período</div><div class="v">${brl(total)}</div><div class="s">${daysWith ? `média ${brl(total / daysWith)} por dia` : 'sem vendas lançadas'}</div></div>
    <div class="card stat"><div class="l">Compras (recebimentos)</div><div class="v">${brl(sum(recvP, e => e.total))}</div><div class="s">${recvP.length} lançamento${recvP.length === 1 ? '' : 's'}${total > 0 ? ` · ${pct(sum(recvP, e => e.total) / total)} das vendas` : ''}</div></div>
    <div class="card stat"><div class="l">Boletos a pagar no período</div><div class="v ${dueP.length ? 'warn' : ''}">${brl(sum(dueP, b => b.amount))}</div><div class="s">${dueP.length} em aberto</div></div>
    <div class="card stat"><div class="l">Boletos vencidos</div><div class="v ${overdue.length ? 'bad' : 'ok'}">${brl(sum(overdue, b => b.amount))}</div><div class="s">${overdue.length ? overdue.length + ' boleto(s)' : 'nenhum'} · próximos 7 dias: ${brl(sum(next7, b => b.amount))}</div></div>
  </div>
  <div class="card"><h3>Vendas por forma de pagamento</h3>
    ${total > 0 ? `<div class="seg" role="img" aria-label="Divisão das vendas por forma de pagamento">${METHODS.map(([k, , c]) => `<div style="width:${totM(k) / total * 100}%;background:${c}"></div>`).join('')}</div>
    <div class="leg">${METHODS.map(([k, l, c]) => `<div><i style="background:${c}"></i>${l} <b>${brl(totM(k))}</b> <small>${pct(totM(k) / total)}</small></div>`).join('')}</div>` : '<div class="empty">Sem vendas lançadas neste período.</div>'}
  </div>
  <div class="card"><h3>${S.period.m === -1 ? 'Vendas por mês' : 'Vendas por dia'}</h3>${barChart(items, 'Vendas por ' + (S.period.m === -1 ? 'mês' : 'dia'))}</div>
  <div class="card"><h3>Entrou hoje</h3>${recvToday.length ? `<div class="list">${recvToday.map(e => `<div class="it"><div class="main"><div class="t">${esc(e.supplierName)}</div><div class="sub">${e.manual ? 'Sem nota fiscal' : 'NF ' + esc(e.invoiceNo || '')} · ${e.payment === 'avista' ? 'à vista' : 'boleto'}</div></div><div class="amt">${brl(e.total)}</div></div>`).join('')}</div>` : '<div class="empty">Nenhum recebimento lançado hoje.</div>'}</div>`;
};

/* ============================ VENDAS ============================ */

}

  const tot = list.reduce((a, s) => a + saleTotal(s), 0);

  return `
  <div class="card">
    <div class="sec" style="margin-top:0"><h2>Lançar vendas do dia</h2>${existing ? '<span class="b ok">já lançado</span>' : ''}</div>
    <label class="f">Data<input type="date" id="s-date" value="${d}" max="${addDays(todayISO(), 1)}"></label>
    <div class="row2">
      ${METHODS.map(([k, l]) => `<label class="f">${l} (R$)<input class="s-in" id="s-${k}" inputmode="decimal" placeholder="0,00" value="${val(k)}"></label>`).join('')}
    </div>
    <label class="f">Observação (opcional)<input class="s-in" id="s-note" value="${esc(v.note || '')}" placeholder="ex.: dia de chuva, evento"></label>

    ${METHODS.map(([k, l]) => `<div class="card stat"><div class="l">${l}</div><div class="v" style="font-size:18px">${brl(m(k))}</div><div class="s">${tot ? pct(m(k) / tot) : '—'}</div></div>`).join('')}

};
H.input.push(t => {

A.closePhoto = () => { const m = $('#photoLayer'); if (m) m.remove(); };

    <label class="f">Fornecedor<select id="e-sup"><option value="">Escolha…</option>${sups.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>

A.addItem = () => { $('#e-items').insertAdjacentHTML('beforeend', itemRow()); };
A.rmItem = el => { const row = el.closest('.item'); if ($$('#e-items .item').length > 1) row.remove(); else $$('input', row).forEach(i => i.value = ''); updateItemSum(); };
function readItems() {
  return $$('#e-items .item').map(r => ({ productId: r.dataset.pid || null, name: $('.it-name', r).value.trim(), qty: parseMoney($('.it-qty', r).value), unitCost: parseMoney($('.it-cost', r).value) })).filter(i => i.name && (i.qty > 0 || i.unitCost > 0)).map(i => ({ ...i, qty: i.qty || 1 }));
}
function updateItemSum() {
  const s = readItems().reduce((a, i) => a + i.qty * i.unitCost, 0);
  const el = $('#e-itemsum'); if (el) el.innerHTML = s > 0 ? `Soma dos itens: <b>${brl(s)}</b> <button class="btn link" data-act="useItemSum">usar como total</button>` : '';
}
A.useItemSum = () => { const s = readItems().reduce((a, i) => a + i.qty * i.unitCost, 0); $('#e-total').value = r2(s).toFixed(2).replace('.', ','); rebuildParcels(); };
function itemHint(row) {
  const pid = row.dataset.pid, cost = parseMoney($('.it-cost', row).value), h = $('.hint', row);
  const p = pid && S.data.products.find(x => x.id === pid);
  if (!p || !(cost > 0)) { h.innerHTML = ''; return; }
  const st = S.data.settings, t = (+st.tax || 0) / 100, c = (+st.cardFee || 0) / 100;
  let s = '';
  if (p.cost > 0) { const d = cost / p.cost - 1; s += Math.abs(d) < 0.0005 ? `<span class="muted">custo igual ao último (${brl(p.cost)})</span>` : `<span class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '↑' : '↓'} ${pct(Math.abs(d))} vs último custo (${brl(p.cost)})</span>`; }
  if (p.price > 0) { const m = 1 - cost / p.price - t - c, tm = ((p.targetMargin ?? '') !== '' ? +p.targetMargin : +st.targetMargin) / 100; s += ` · venda ${brl(p.price)}: margem <b class="${m < tm - 0.01 ? 'up' : 'down'}">${pct(m)}</b>`; }
  h.innerHTML = s;
}

    row.dataset.pid = p ? p.id : '';

  if (t.id === 'e-photo') { S.entryPhoto = null; if (t.files[0]) { try { S.entryPhoto = await compressImage(t.files[0]); toast('Foto anexada'); } catch (e) { toast(e.message, 'err'); } } }
  if (t.classList.contains('pc-amt') || t.classList.contains('pc-date')) updateParcelSum();
});
function rebuildParcels() {
  const box = $('#e-parcels'); if (!box) return;
  const n = +$('#e-n').value || 1, first = $('#e-first').value || todayISO();
  const total = parseMoney($('#e-total').value) || readItems().reduce((a, i) => a + i.qty * i.unitCost, 0);
  const each = Math.floor(total / n * 100) / 100; let acc = 0;
  box.innerHTML = Array.from({ length: n }, (_, i) => {
    const amt = i === n - 1 ? r2(total - acc) : each; acc += each;
    return `<div class="pc"><b>${i + 1}</b><input type="date" class="pc-date" value="${addMonths(first, i)}"><input class="pc-amt" inputmode="decimal" value="${total ? amt.toFixed(2).replace('.', ',') : ''}" placeholder="R$"></div>`;
  }).join('');

}
function updateParcelSum() {
  const el = $('#e-psum'); if (!el) return;
  const s = $$('.pc-amt').reduce((a, i) => a + parseMoney(i.value), 0), t = parseMoney($('#e-total').value);
  el.innerHTML = t ? (Math.abs(s - t) > 0.05 ? `<span class="up">Parcelas somam ${brl(s)} (total ${brl(t)})</span>` : `Parcelas somam ${brl(s)}`) : '';

A.saveEntry = () => {
  const ctx = S.entryCtx || {}, e = ctx.entry, r = ctx.receipt;
  const supplier = S.data.suppliers.find(x => x.id === $('#e-sup').value); if (!supplier) return toast('Escolha o fornecedor', 'err');
  const date = $('#e-date').value; if (!date) return toast('Informe a data', 'err');
  const items = e ? (e.items || []) : readItems();
  const itemsSum = items.reduce((a, i) => a + i.qty * i.unitCost, 0);
  let total = parseMoney($('#e-total').value); if (!total && itemsSum > 0) total = r2(itemsSum);
  if (!(total > 0)) return toast('Informe o valor total', 'err');
  const base = { date, supplierId: supplier.id, supplierName: supplier.name, invoiceNo: $('#e-nf-no').value.trim(), total, manual: !$('#e-nf').checked, note: $('#e-note').value.trim() };
  const ops = [];
  if (e) {
    ops.push({ t: 'set', coll: 'entries', id: e.id, data: base });
    S.data.bills.filter(b => b.entryId === e.id).forEach(b => ops.push({ t: 'set', coll: 'bills', id: b.id, data: { supplierName: supplier.name, supplierId: supplier.id, invoiceNo: base.invoiceNo } }));
    save(DB.batch(ops)); closeModal(); toast('Recebimento atualizado'); return;
  }
  const pay = $('#e-pay').value; let parcels = [];
  if (pay === 'boleto') {
    parcels = $$('#e-parcels .pc').map(row => ({ date: $('.pc-date', row).value, amount: parseMoney($('.pc-amt', row).value) }));
    if (!parcels.length || parcels.some(p => !p.date || !(p.amount > 0))) return toast('Confira as parcelas do boleto', 'err');
    const sum = parcels.reduce((a, p) => a + p.amount, 0);
    if (Math.abs(sum - total) > 0.05) return toast(`Parcelas somam ${brl(sum)}, diferente do total ${brl(total)}`, 'err');
  }
  const id = uid(), now = new Date().toISOString();
  const photoIds = r ? photoIdsOf(r) : (S.entryPhoto ? [id] : []);
  const entry = { ...base, payment: pay, items, receiptId: r?.id || null, photoId: photoIds[0] || null, photoIds, createdAt: now, ...(pay === 'avista' ? { paidAt: date } : {}) };
  ops.push({ t: 'set', coll: 'entries', id, data: entry });
  parcels.forEach((p, i) => ops.push({ t: 'set', coll: 'bills', id: uid() + i, data: { entryId: id, supplierId: supplier.id, supplierName: supplier.name, invoiceNo: base.invoiceNo, dueDate: p.date, amount: p.amount, parcel: `${i + 1}/${parcels.length}`, status: 'aberto', ddaOk: false, createdAt: now } }));
  if (!r && S.entryPhoto) ops.push({ t: 'set', coll: 'receiptPhotos', id, data: { data: S.entryPhoto, createdBy: S.user.uid, createdAt: now } });
  if (r) ops.push({ t: 'set', coll: 'receipts', id: r.id, data: { status: 'lancado', entryId: id, launchedAt: now } });
  // custos e estoque dos produtos
  const addStock = $('#e-addstock')?.checked, upd = new Map();
  items.forEach(it => {
    if (!it.productId) return;
    const p = upd.get(it.productId) || { ...S.data.products.find(x => x.id === it.productId) }; if (!p.id) return;
    if (it.unitCost > 0) {
      if (p.cost !== it.unitCost) { p.prevCost = p.cost || 0; p.cost = it.unitCost; }
      p.lastCostDate = date; p.costHistory = [...(p.costHistory || []), { date, cost: it.unitCost, supplierId: supplier.id }].slice(-20);
    }
    if (addStock) { p.stock = r2((parseMoney(p.stock) || 0) + it.qty); p.stockDate = todayISO(); }
    upd.set(it.productId, p);
  });
  upd.forEach(p => ops.push({ t: 'set', coll: 'products', id: p.id, data: { cost: p.cost, prevCost: p.prevCost ?? 0, lastCostDate: p.lastCostDate || null, costHistory: p.costHistory || [], stock: p.stock ?? null, stockDate: p.stockDate || null } }));
  save(DB.batch(ops)); closeModal();
  const ups = [...upd.values()].filter(p => p.prevCost > 0 && p.cost > p.prevCost * 1.001).length;
  toast('Recebimento lançado' + (parcels.length ? ` com ${parcels.length} boleto(s)` : '') + (ups ? ` · ${ups} custo(s) em alta` : ''));

/* ============================ BOLETOS ============================ */
function billBadge(b) {
  if (b.status === 'pago') return `<span class="b ok">Pago ${fmtShort(b.paidAt)}</span>`;
  const d = daysBetween(todayISO(), b.dueDate);
  if (d < 0) return `<span class="b bad">Vencido há ${-d} d</span>`;
  if (d === 0) return '<span class="b warn">Vence hoje</span>';
  return `<span class="b ${d <= 7 ? 'warn' : 'mut'}">Em ${d} d</span>`;
}
const billTitle = b => esc(b.supplierName || b.description || 'Boleto avulso');
function filteredBills() {
  const f = S.billF, t = todayISO();
  let l = S.data.bills.slice();
  if (f.supplier) l = l.filter(b => b.supplierId === f.supplier);
  if (f.status === 'abertos') l = l.filter(b => b.status !== 'pago');
  else if (f.status === 'vencidos') l = l.filter(b => b.status !== 'pago' && b.dueDate < t);
  else if (f.status === 'pagos') l = l.filter(b => b.status === 'pago' && inPeriod(b.paidAt || b.dueDate));
  else l = l.filter(b => inPeriod(b.dueDate));
  return l.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
}
VIEWS.bills = () => {
  const f = S.billF, t = todayISO();

      (list.length ? Object.keys(groups).sort().map(d => `<div class="card list"><div class="grp" style="margin-top:-14px;border-radius:14px 14px 0 0"><span>${fmtDate(d)} <small>${weekday(d)}</small></span><span>${brl(groups[d].reduce((a, b) => a + b.amount, 0))}</span></div>${groups[d].map(b => `<label class="it" style="cursor:pointer"><input type="checkbox" data-act="ddaToggle" data-id="${b.id}" ${b.ddaOk ? 'checked' : ''} style="margin-top:4px;width:20px;height:20px"><div class="main"><div class="t">${billTitle(b)}</div><div class="sub">${b.invoiceNo ? 'NF ' + esc(b.invoiceNo) + ' · ' : ''}${b.parcel ? 'parcela ' + b.parcel : ''}</div></div><div class="amt">${brl(b.amount)}</div></label>`).join('')}</div>`).join('') : '<div class="empty card">Nenhum boleto em aberto com vencimento neste período.</div>');
  } else {
    body = `<div class="card list">${list.length ? list.map(b => `<div class="it"><div class="main"><div class="t">${billTitle(b)} ${billBadge(b)}</div><div class="sub">Vence ${fmtDate(b.dueDate)}${b.parcel ? ' · parcela ' + b.parcel : ''}${b.invoiceNo ? ' · NF ' + esc(b.invoiceNo) : ''}${b.status === 'pago' && b.payMethod ? ' · ' + esc(b.payMethod) : ''}${b.ddaOk ? ' · conferido no DDA' : ''}</div>
      <div class="actions" style="margin-top:8px">${b.status === 'pago' ? `<button class="btn sec2 sm" data-act="unpayBill" data-id="${b.id}">Desfazer pagamento</button>` : `<button class="btn sm" data-act="payBill" data-id="${b.id}">Marcar pago</button>`}<button class="btn sec2 sm" data-act="editBill" data-id="${b.id}">Editar</button></div></div><div class="amt">${brl(b.amount)}</div></div>`).join('') + `<div class="tot"><span>Total (${list.length})</span><span>${brl(tot)}</span></div>` : '<div class="empty">Nada por aqui.</div>'}</div>`;

/* ============================ ESTOQUE ============================ */
const supProducts = sid => S.data.products.filter(p => p.supplierId === sid && p.active !== false).sort(byName);
function curStock(p) { const c = S.counts[p.id]; return c !== undefined ? c : (p.stock ?? ''); }
function suggestQty(p) {
  const c = curStock(p); if (c === '' || c === null) return 0;
  const cur = parseMoney(c), min = +p.minStock || 0; if (!(min > 0) || cur > min) return 0;
  const target = +p.targetStock || min * 2; return Math.max(0, r2(target - cur));
}
const orderQty = p => S.orderQty[p.id] !== undefined ? parseMoney(S.orderQty[p.id]) : suggestQty(p);
function orderMessage(sid) {
  const sup = S.data.suppliers.find(s => s.id === sid), st = S.data.settings;
  const lines = supProducts(sid).map(p => [p, orderQty(p)]).filter(([, q]) => q > 0).map(([p, q]) => `• ${num(q)} ${p.unit || 'un'} — ${p.name}`);
  if (!lines.length) return '';
  return `Olá${sup ? ', ' + sup.name.replace(/\s*\(.*\)/, '') : ''}! Aqui é ${st.ownerName ? 'o ' + st.ownerName + ' ' : ''}da ${st.storeName}. Segue o pedido de reposição:\n\n${lines.join('\n')}\n\nPode confirmar disponibilidade, valor e prazo de entrega? Obrigado!`;
}
function pendingCount(sid) { return supProducts(sid).filter(p => orderQty(p) > 0).length; }

VIEWS.stock = () => {
  const tabs = `<div class="tabs2"><button class="${S.stockTab === 'order' ? 'on' : ''}" data-act="stockTab" data-t="order">Pedidos</button><button class="${S.stockTab === 'products' ? 'on' : ''}" data-act="stockTab" data-t="products">Produtos</button><button class="${S.stockTab === 'prices' ? 'on' : ''}" data-act="stockTab" data-t="prices">Preços</button></div>`;
  return tabs + (S.stockTab === 'order' ? viewOrder() : S.stockTab === 'products' ? viewProducts() : viewPrices());
};
A.stockTab = el => { S.stockTab = el.dataset.t; render(); };

function viewOrder() {
  const sups = suppliersActive();
  if (!sups.length) return '<div class="card empty">Cadastre fornecedores (aba Mais) e produtos para gerar pedidos.</div>';
  if (!S.orderSupplier || !sups.find(s => s.id === S.orderSupplier)) S.orderSupplier = (sups.find(s => pendingCount(s.id) > 0) || sups[0]).id;
  const sid = S.orderSupplier, sup = sups.find(s => s.id === sid), prods = supProducts(sid), msg = orderMessage(sid);
  return `

    <label class="f">Data que chegou<input type="date" id="sd-date" value="${f.date}" style="min-height:52px"></label>
    <div class="photobox">
      ${n ? `<div class="thumbs">${f.photos.map((p, i) => `<div class="th"><img src="${p}" alt="Foto ${i + 1}"><button class="x" data-act="rmPhoto" data-i="${i}" aria-label="Remover foto ${i + 1}">&times;</button></div>`).join('')}</div><div class="sub" style="margin-bottom:10px">${n} foto${n > 1 ? 's' : ''} (máx. ${MAX_PHOTOS})</div>` : ''}
      <label class="btn big block" for="sd-photo" style="cursor:pointer">${ico('camera')} ${n ? 'Adicionar outra foto' : (f.hasNF ? 'Tirar foto da nota' : 'Tirar foto (pesagem, produto)')}</label>
      <input type="file" id="sd-photo" accept="image/*" capture="environment" hidden>
      <label class="btn sec2 block" for="sd-gallery" style="margin-top:8px;cursor:pointer">Escolher da galeria (várias de uma vez)</label>
      <input type="file" id="sd-gallery" accept="image/*" multiple hidden>
    </div>
    <label class="f" style="margin-top:12px">${f.hasNF ? 'Observação (opcional)' : 'O que chegou? (opcional se mandar as fotos)'}<textarea id="sd-note" style="min-height:90px" placeholder="${f.hasNF ? '' : 'ex.: 12 geleias de pimenta, 6 méis'}">${esc(f.note)}</textarea></label>
    <button class="btn big block" data-act="submitReceipt">Enviar</button>
  </div>`;
};
A.staffNF = el => { S.staffForm.hasNF = el.dataset.v === '1'; render(); };
A.sendAnother = () => { S.staffForm = freshStaffForm(); S.staffDone = false; render(); };
A.rmPhoto = el => { S.staffForm.photos.splice(+el.dataset.i, 1); render(); };
H.change.push(async t => {
  if (t.id === 'sd-sup') S.staffForm.supplierId = t.value;
  if (t.id === 'sd-date') S.staffForm.date = t.value || todayISO();
  if ((t.id === 'sd-photo' || t.id === 'sd-gallery') && t.files.length) {
    const files = [...t.files]; t.value = '';
    toast('Preparando ' + (files.length > 1 ? files.length + ' fotos…' : 'a foto…'));
    for (const file of files) {
      if (S.staffForm.photos.length >= MAX_PHOTOS) { toast(`Máximo de ${MAX_PHOTOS} fotos por envio`, 'err'); break; }
      try { S.staffForm.photos.push(await compressImage(file)); } catch (e) { toast(e.message, 'err'); }
    }
    render();
  }
});
H.input.push(t => { if (t.id === 'sd-note') S.staffForm.note = t.value; });
A.submitReceipt = () => {
  const f = S.staffForm, sup = S.data.suppliers.find(s => s.id === f.supplierId);
  if (f.hasNF && !f.photos.length) return toast('Tire a foto da nota', 'err');
  if (!f.hasNF && !f.photos.length && !f.note.trim()) return toast('Mande uma foto ou descreva o que chegou', 'err');
  const id = uid(), now = new Date().toISOString(), ids = f.photos.map((_, i) => `${id}-${i}`);
  f.photos.forEach((ph, i) => save(DB.set('receiptPhotos', ids[i], { data: ph, createdBy: S.user.uid, createdAt: now }, false)));
  save(DB.set('receipts', id, { date: f.date, supplierId: sup ? sup.id : '', supplierName: sup ? sup.name : '', hasNF: f.hasNF, note: f.note.trim(), status: 'pendente', createdBy: S.user.uid, createdByName: S.user.name || '', createdAt: now, photoId: ids[0] || null, photoIds: ids }, false));
  S.staffForm = freshStaffForm(); S.staffDone = true; render(); window.scrollTo(0, 0);
};
VIEWS.count = () => {
  const f = S.staffCount;
  if (f.done) return `<div class="card ok-big">${ico('check')}<h2>Contagem enviada!</h2><p>O estoque já aparece atualizado para o gerente, com o pedido do fornecedor.</p><button class="btn big block" data-act="countAgain">Contar outro fornecedor</button></div>`;
  const all = S.data.stock.filter(s => s.active !== false);
  const sups = suppliersActive().filter(s => all.some(p => p.supplierId === s.id));
  if (!sups.length) return '<div class="card empty">Ainda não há produtos liberados para contagem. Avise o gerente.</div>';
  const prods = f.supplierId ? all.filter(p => p.supplierId === f.supplierId).sort(byName) : [];
  const filled = prods.filter(p => String(f.vals[p.id] ?? '').trim() !== '').length;
  return `<div class="card"><h2 style="margin-bottom:6px">Contagem de estoque</h2>
    <small>Escolha o fornecedor e digite quanto tem de cada produto (loja e depósito). Deixe em branco o que não contou.</small>
    <div class="chips" style="margin-top:10px">${sups.map(s => `<button class="chip big-chip ${f.supplierId === s.id ? 'on' : ''}" data-act="countSup" data-id="${s.id}">${esc(s.name.replace(/\s*\(.*\)/, ''))}</button>`).join('')}</div>
    ${f.supplierId ? `<div>${prods.map(p => `<div class="crow"><div class="pname">${esc(p.name)}<br><small>${p.qty !== null && p.qty !== undefined ? 'última contagem: ' + num(p.qty) + ' ' + esc(p.unit || '') + (p.qtyDate ? ' (' + fmtShort(p.qtyDate) + ')' : '') : 'sem contagem anterior'}</small></div><input class="cq" data-pid="${p.id}" inputmode="decimal" placeholder="${esc(p.unit || 'un')}" value="${esc(f.vals[p.id] ?? '')}"></div>`).join('')}</div>
    <label class="f" style="margin-top:12px">Observação (opcional)<textarea id="ct-note" style="min-height:70px" placeholder="ex.: 2 brie com validade curta">${esc(f.note)}</textarea></label>
    <div class="sub" style="margin-bottom:8px">Preenchidos: <b id="cnt-n">${filled}</b> de ${prods.length}</div>
    <button class="btn big block" data-act="submitCount">Enviar contagem</button>` : ''}</div>`;
};
A.countSup = el => { S.staffCount.supplierId = el.dataset.id; render(); };
A.countAgain = () => { S.staffCount = { supplierId: '', vals: {}, note: '', done: false }; render(); window.scrollTo(0, 0); };
H.input.push(t => {
  if (t.classList.contains('cq')) { S.staffCount.vals[t.dataset.pid] = t.value; const n = $$('.cq').filter(i => i.value.trim() !== '').length; const el = $('#cnt-n'); if (el) el.textContent = n; }
  if (t.id === 'ct-note') S.staffCount.note = t.value;
});
A.submitCount = () => {
  const f = S.staffCount, sup = S.data.suppliers.find(s => s.id === f.supplierId); if (!sup) return toast('Escolha o fornecedor', 'err');
  const lines = S.data.stock.filter(p => p.supplierId === sup.id && p.active !== false).filter(p => String(f.vals[p.id] ?? '').trim() !== '').map(p => ({ productId: p.id, name: p.name, unit: p.unit || 'un', qty: parseMoney(f.vals[p.id]) }));
  if (!lines.length) return toast('Preencha ao menos um produto', 'err');
  const now = new Date().toISOString();
  save(DB.set('stockCounts', uid(), { supplierId: sup.id, supplierName: sup.name, date: todayISO(), lines, note: (f.note || '').trim(), status: 'novo', createdBy: S.user.uid, createdByName: S.user.name || '', createdAt: now }, false));
  S.staffCount = { supplierId: '', vals: {}, note: '', done: true }; render(); window.scrollTo(0, 0);
};
VIEWS.mine = () => {
  const items = [
    ...S.data.receipts.map(r => ({ t: r.createdAt || '', h: `<div class="it"><div class="main"><div class="t">${esc(r.supplierName || 'Fornecedor a informar')}</div><div class="sub">${fmtDate(r.date)} · ${r.hasNF === false ? 'sem nota' : 'com nota'}${photoIdsOf(r).length ? ' · ' + photoIdsOf(r).length + ' foto(s)' : ''}${r.note ? ' · ' + esc(r.note) : ''}</div></div>${r.status === 'lancado' ? '<span class="b ok">Recebida</span>' : '<span class="b warn">Aguardando lançamento</span>'}</div>` })),
    ...S.data.stockCounts.map(c => ({ t: c.createdAt || '', h: `<div class="it"><div class="main"><div class="t">Contagem · ${esc(c.supplierName)}</div><div class="sub">${fmtDate(c.date)} · ${(c.lines || []).length} produto(s)${c.note ? ' · ' + esc(c.note) : ''}</div></div><span class="b ok">Enviada</span></div>` }))
  ].sort((a, b) => b.t.localeCompare(a.t)).slice(0, 50);
  return `<div class="sec"><h2>Meus envios</h2></div><div class="card list">${items.length ? items.map(x => x.h).join('') : '<div class="empty">Você ainda não enviou nada.</div>'}</div>`;
};

boot();
</script>
</body>
</html>
